<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Humanizer</title>
    <!-- Links to your styling file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>AI Text Humanizer</h1>
        <p>Convert robotic AI text into natural, human-like writing.</p>

        <!-- Input Section -->
        <div class="text-area-container">
            <textarea id="aiInput" placeholder="Paste your AI-generated text here..."></textarea>
        </div>

        <!-- Action Button -->
        <button id="humanizeBtn">Humanize Text</button>

        <!-- Output Section -->
        <div class="text-area-container">
            <h2>Humanized Result:</h2>
            <div id="humanOutput" class="output-box">Your humanized text will appear here...</div>
        </div>
    </div>

    <!-- Links to your logic code -->
    <script src="script.js"></script>
</body>
</html>
